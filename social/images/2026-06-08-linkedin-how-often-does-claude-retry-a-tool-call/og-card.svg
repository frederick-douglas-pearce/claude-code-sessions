<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
<rect x="0" y="0" width="1200" height="630" fill="#0f0f14"/>
<text x="600" y="62" text-anchor="middle" fill="#ffffff" font-size="56" font-weight="300">How often does Claude</text>
<text x="600" y="120" text-anchor="middle" fill="#ffffff" font-size="56" font-weight="300">retry a tool call?</text>
<text x="600" y="158" text-anchor="middle" fill="#c0c0c8" font-size="28" font-weight="400">One error flag. One clean recovery.</text>
<g>
<rect x="244" y="174" width="712" height="410" rx="14" fill="#16161d"/>
<rect x="244" y="174" width="712" height="38" rx="14" fill="#1d1d26"/>
<rect x="244" y="198" width="712" height="14" fill="#1d1d26"/>
<circle cx="273" cy="193" r="6.5" fill="#ff5f56"/>
<circle cx="295" cy="193" r="6.5" fill="#ffbd2e"/>
<circle cx="317" cy="193" r="6.5" fill="#27c93f"/>
<g font-family="'JetBrains Mono','SF Mono',Consolas,monospace" font-size="20" xml:space="preserve">
<text x="280" y="240"><tspan fill="#8a8a99">// </tspan><tspan fill="#8a8a99">failed call</tspan></text>
<text x="280" y="262"><tspan fill="#8a8a99">{ </tspan><tspan fill="#2698ba">"name"</tspan><tspan fill="#8a8a99">: </tspan><tspan fill="#11d68b">"Read"</tspan><tspan fill="#8a8a99">,</tspan></text>
<text x="304" y="284"><tspan fill="#2698ba">"input"</tspan><tspan fill="#8a8a99">: { </tspan><tspan fill="#2698ba">"offset"</tspan><tspan fill="#8a8a99">: [</tspan><tspan fill="#efcc00">447</tspan><tspan fill="#8a8a99">, </tspan><tspan fill="#efcc00">525</tspan><tspan fill="#8a8a99">] } }</tspan></text>
<text x="280" y="306"></text>
<text x="280" y="328"><tspan fill="#8a8a99">// error resul</tspan><tspan fill="#8a8a99">t</tspan></text>
<text x="280" y="350"><tspan fill="#8a8a99">{ </tspan><tspan fill="#2698ba">"is_error"</tspan><tspan fill="#8a8a99">: </tspan><tspan fill="#8a8a99">true</tspan><tspan fill="#8a8a99">,</tspan></text>
<text x="304" y="372"><tspan fill="#2698ba">"content"</tspan><tspan fill="#8a8a99">: </tspan><tspan fill="#11d68b">"InputValidationError"</tspan><tspan fill="#8a8a99"> }</tspan></text>
<text x="280" y="394"></text>
<text x="280" y="416"><tspan fill="#8a8a99">// re</tspan><tspan fill="#8a8a99">try — correc</tspan><tspan fill="#8a8a99">ted</tspan></text>
<text x="280" y="438"><tspan fill="#8a8a99">{ </tspan><tspan fill="#2698ba">"name"</tspan><tspan fill="#8a8a99">: </tspan><tspan fill="#11d68b">"Read"</tspan><tspan fill="#8a8a99">,</tspan></text>
<text x="304" y="460"><tspan fill="#2698ba">"input"</tspan><tspan fill="#8a8a99">: { </tspan><tspan fill="#2698ba">"offset"</tspan><tspan fill="#8a8a99">: </tspan><tspan fill="#efcc00">447</tspan><tspan fill="#8a8a99">, </tspan><tspan fill="#2698ba">"limit"</tspan><tspan fill="#8a8a99">: </tspan><tspan fill="#efcc00">80</tspan><tspan fill="#8a8a99"> } }</tspan></text>
</g>
</g>
<text x="38" y="606" fill="#8a8a99" font-size="22" font-weight="300">Frederick Pearce · Data. AI. Human.</text>
