notes = """
Rewritten for #274. The first version of this card was authored from the same
key-count scan as the first version of fixtures/synthetic/anatomy-hook-trace.jsonl,
and inherited the same six errors. #257 corrected the fixture. This corrects the
card, against the sanitized hook-trace fixtures that settled the question.

What the previous card asserted, and what the fixtures show:

- `"toolUseID": "toolu_synthetic_004"` — a Stop-hook `toolUseID` is a bare UUID
  that resolves to nothing. The post's point is that it is NOT a `tool_use.id`,
  "since those carry a `toolu_` prefix". Rendering one with that prefix asserted
  the exact join the post disproves. Now `55555555-…-4008`, the synthetic
  fixture's family, chosen there precisely because it is disjoint from every
  `uuid` in the file.
- `"preventedContinuation": true` — `false` on all 8 observed `stop_hook_summary`
  lines, including the one where the Stop hook returned a block. Nothing in
  465,452 lines has ever been observed setting it true, which is #260.
- `"hookInfos": ["<unread>"]` — an array of objects, `{command, durationMs}`.
- `"subtype": "<unread>"` — `stop_hook_summary`, on 4,159 of 4,159 family lines
  once scan 0.4.0 folded the value (#254).
- `"stopReason": "<unread>"` — `""`, including on the blocking turn.
- `"hasOutput": true` beside `hookErrors: []` and no `hookAdditionalContext` —
  output with nothing to have output. Here `hasOutput: true` sits with a
  populated `hookAdditionalContext`, which is the turn that produced it.

The hero is the inject-context outcome rather than the plain allow: it is the
one turn where a hook's own words reach the transcript intact, so the record
shows both the field family and the one place a hook speaks for itself.

`hookCount`, `hookErrors`, `hasOutput` and `stopReason` are dropped for room,
not because anything is wrong with them. The 16-line budget is exact: 11 lines
of Stop-hook record plus the 5-line `informational` record. Longest line is 55
characters against the 56-character limit (`x_end = 280 + len*12` must stay
under 956).

Second object, rewritten for #247. The previous card put a `permission-mode`
line under the hook record, on the claim that both record something a hook
did. The hook-trace fixtures contradict that: a `permission-mode` line is
written ahead of every prompt, repeating an unchanged value, before any hook
runs. The post's section on it was cut for the same reason. Its replacement is
the post's second hook shape, the `informational` line a refusing prompt hook
leaves. Stacked under the Stop-hook record, it makes the post's point in two
keys: `preventedContinuation` on one shape, `preventContinuation` on the
other, and no `hookCount` or `hookInfos` on the second. `content` and `level`
are dropped for room; `content` carries the hook's verbatim reasoning, which
has no place on a public card.

Subhead. The previous one read "Thirty events out. Seven fields back." Both
halves had gone stale. The event count is thirty in the reference and
thirty-three in Claude Code's own documentation, which the post now
distinguishes. The field tally moved twice: the published post corrects the
seven-field family to six plus an optional one, and the editorial pass in #256
reframes it again to five measured by co-occurrence. A subhead that counts
fields would need re-rendering every time that framing moves. "Three shapes
back" is the post's structural finding, the on-disk hook record takes three
forms. Through #247 the third form changed from the `permission-mode` line to
the `informational` refusal line, but the count stayed three, so the subhead
holds. 43 characters.

Data is synthetic throughout. `55555555-…-4008` and the `informational` line
follow fixtures/synthetic/anatomy-hook-trace.jsonl; the hook command and the
injected-context string are shortened to fit the window. Every key shown is one
the sanitized fixtures observe. No session UUIDs, paths, or prompts appear.
"""
