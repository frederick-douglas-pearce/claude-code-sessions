name: Sanitizer CI

# The always-on gate in front of a published artifact (issue #162). Before
# this workflow there was no Python CI in this repo at all: the sanitizer's
# pytest suite ran when someone remembered to run it, and nothing built the
# wheel or checked its metadata. That is tolerable for an in-repo tool with
# one user; it is not tolerable once `pip install claude-code-sessions-
# sanitizer` puts the tool in strangers' hands, because the release workflow
# needs something authoritative to depend on: tests green on the exact commit
# being published.
#
# Why there is no `paths:` filter, even though the work is sanitizer-scoped:
#
#   1. This workflow's `gate` job is a REQUIRED status check. GitHub leaves a
#      required check permanently "Expected" on any PR where its workflow did
#      not trigger, so a paths-filtered required check blocks every post-only
#      PR forever. The usual workaround is a diff-detection job plus a
#      conditional gate, which trades a filter for a more fragile moving
#      part.
#   2. The suite is not actually sanitizer-scoped. `test_secret_patterns_in_
#      sync.py` loads `.claude/hooks/detect_secrets_in_output.py` and asserts
#      the vendored Tier-1 patterns match it element-wise (PRD section 9 /
#      D-6). A filter on `tooling/sanitizer/**` would let a hook-side pattern
#      edit merge without the sanitizer side, which is the exact drift that
#      test exists to catch.
#
# The suite runs in a few seconds -- most of it the placement matrix in
# `test_adversarial_placement.py`, which spawns one subprocess per cell.
# Running it unconditionally still costs less than either failure mode
# above. Keep this number honest: it is the stated basis for having no
# `paths:` filter, so anyone reconsidering that filter reasons from it.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Callable so `sanitizer-release.yml` can re-run this entire gate against
  # the tagged ref (issue #163). A local `uses: ./.github/workflows/...`
  # call runs at the caller's commit, which is what makes "tests were green
  # on the exact bytes being published" a structural property rather than a
  # status lookup that has to remember to treat *absent* as failure.
  #
  # Note what this trigger does NOT change: a tag push still does not fire
  # this workflow on its own (`push:` is branch-filtered), and the required
  # `sanitizer-ci` check on pull requests is unaffected. When called, the
  # gate job reports under the caller's job name (`ci / sanitizer-ci`).
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # One red interpreter should not hide the state of the other two: the
      # interesting failure here is "3.13 disagrees with 3.11", which is only
      # legible if every cell reports.
      fail-fast: false
      matrix:
        # Mirrors the `Programming Language :: Python :: 3.x` classifiers in
        # tooling/sanitizer/pyproject.toml. A classifier the CI does not
        # verify gets removed or gets verified; it does not stay unverified.
        # If a classifier is added there, add the cell here in the same PR.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tooling/sanitizer/pyproject.toml

      # Editable install from the repo root, by path. Not a `cd` into the
      # package directory and not a developer's local `.venv`: the sync test
      # walks three parents up from its own file to find the repo root, so it
      # only passes when the checkout is intact, and pinning the invocation
      # to repo-root-relative paths keeps that true.
      - name: Install the sanitizer and its dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./tooling/sanitizer[dev]"

      # Fails the build if a security-critical suite is renamed or deleted
      # without this list being updated. Without it, `pytest <dir>` on a
      # directory that quietly lost a file is still green, and the gate in
      # front of a published security tool goes hollow without anyone
      # noticing. Cheap; runs before the suite so the diagnostic is specific.
      - name: Confirm the security-critical suites are present
        run: |
          set -euo pipefail
          for suite in \
            test_residual.py \
            test_orchestrator.py \
            test_secret_patterns_in_sync.py \
            test_sidecar.py \
            test_golden_determinism.py \
            test_release.py \
            test_adversarial_placement.py
          do
            path="tooling/sanitizer/tests/$suite"
            if [ ! -f "$path" ]; then
              echo "::error::missing security-critical suite: $path"
              exit 1
            fi
          done

      - name: Run the sanitizer test suite
        run: python -m pytest tooling/sanitizer/tests -q

      # A skipped test still reports green, so the step above cannot tell you
      # whether the D-6 drift guard ran. It skips itself when it detects an
      # unpacked sdist (issue #182), and that detection is the one property
      # the skip's safety rests on. If it ever misfires in a checkout, the
      # guard between the hook's SECRET_PATTERNS and the sanitizer's
      # VENDORED_PATTERNS stops running and nothing goes red. This asserts
      # the negative that the pass count cannot.
      - name: Confirm the D-6 drift guard actually ran
        run: |
          # No `-e`: pytest's exit code is the signal here, not a reason to
          # stop. Exit 5 means "no tests ran", which is what a module-level
          # skip looks like from outside.
          set -uo pipefail
          python -m pytest tooling/sanitizer/tests/test_secret_patterns_in_sync.py \
            -q -rs > /tmp/drift.txt 2>&1
          status=$?
          cat /tmp/drift.txt
          if [ "$status" -ne 0 ] || grep -q 'skipped' /tmp/drift.txt; then
            echo "::error::the D-6 drift guard did not run clean inside a checkout (pytest exit $status). If it skipped, its sdist condition is wrong and the hook/VENDORED_PATTERNS drift check is not running."
            exit 1
          fi

      # The suite step above cannot tell you whether the placement matrix
      # ran. It skips itself when `ccs_sanitize` is neither on PATH nor
      # importable, and a `-m "not adversarial"` in a future `addopts` would
      # deselect it outright -- both of which still report green with the
      # file present, so the presence check above cannot see the difference.
      # Assert the positive: the marker selects a non-empty set and none of
      # it skipped.
      - name: Confirm the placement matrix actually ran
        run: |
          set -uo pipefail
          python -m pytest tooling/sanitizer/tests -m adversarial -q -rs \
            > /tmp/adv.txt 2>&1
          status=$?
          cat /tmp/adv.txt
          if [ "$status" -ne 0 ] || grep -q 'skipped' /tmp/adv.txt; then
            echo "::error::the placement matrix did not run clean (pytest exit $status). Exit 5 means nothing was collected, which is a deselected or renamed marker; 'skipped' means the entry point did not resolve."
            exit 1
          fi
          if ! grep -qE '[0-9]+ passed' /tmp/adv.txt; then
            echo "::error::the placement matrix reported no passing tests"
            exit 1
          fi

  package:
    name: build + twine check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          # Built on the lowest supported interpreter. The wheel is pure
          # Python and `requires-python = ">=3.11"`, so building on 3.11 is
          # the conservative choice: a backend that emitted a 3.13-only
          # artifact would surface here rather than at upload time.
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine pytest

      - name: Build sdist and wheel
        run: python -m build --sdist --wheel --outdir dist/ tooling/sanitizer

      # `--strict` turns README rendering warnings into failures. PyPI
      # rejects or mangles a project page on exactly these warnings, and
      # finding that out during `twine upload` means burning a version
      # number, because PyPI will not accept a re-upload of the same one.
      - name: twine check --strict
        run: python -m twine check --strict dist/*

      # Metadata being valid is not the same as the artifact working. This
      # installs the built wheel into a clean venv, outside the source tree,
      # and exercises the console script plus `--init`. `--init` is what
      # reads the bundled config template out of package data, so a
      # packaging regression that dropped `_templates` from the wheel would
      # pass `twine check` and fail here -- which is the whole point of a
      # first-run smoke test for a `pip install` user with no clone.
      - name: Smoke-test the built wheel in a clean environment
        run: |
          set -euo pipefail
          python -m venv /tmp/wheel-smoke
          /tmp/wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/wheel-smoke/bin/ccs-sanitize --version
          mkdir -p /tmp/wheel-smoke-run
          cd /tmp/wheel-smoke-run
          /tmp/wheel-smoke/bin/ccs-sanitize --init
          test -s .ccs-sanitize.example.yaml
          # `--init` writes the example AND the live config. The count stands
          # in for the second one, which is not named in a committed file.
          # Kept identical to the same assertion in sanitizer-release.yml and
          # tooling/sanitizer/release.py: three vantage points, one contract.
          written="$(find . -maxdepth 1 -type f | wc -l)"
          if [ "$written" -ne 2 ]; then
            echo "::error::--init produced $written files; expected 2"
            ls -la
            exit 1
          fi

      # The suite above ran against an editable install of the source
      # tree. This runs the placement matrix against the artifact a stranger
      # would actually `pip install`, which is how #190 was found in the
      # first place -- a source-tree run and a wheel run are not the same
      # evidence. The module imports nothing from `ccs_sanitize`; it drives
      # the console script, so pointing `CCS_SANITIZE_BIN` at the wheel venv
      # is the whole wiring.
      - name: Run the placement matrix against the built wheel
        run: |
          # No `set -e`: pytest's exit code is the signal, not a reason to
          # stop before the skip check. This job installs only pip/build/
          # twine/pytest, so `ccs_sanitize` is NOT importable here and
          # `ccs-sanitize` is NOT on PATH -- both of the module's fallback
          # tiers miss. If CCS_SANITIZE_BIN is ever misspelled or refactored
          # away, the module skips all 57 assertions and pytest exits 0. That
          # is the hollow gate this workflow exists to prevent, so the skip
          # check below is what makes the step meaningful, not the exit code.
          set -uo pipefail
          CCS_SANITIZE_BIN=/tmp/wheel-smoke/bin/ccs-sanitize \
            python -m pytest tooling/sanitizer/tests/test_adversarial_placement.py \
            -q -rs > /tmp/wheel-adv.txt 2>&1
          status=$?
          cat /tmp/wheel-adv.txt
          if [ "$status" -ne 0 ] || grep -q 'skipped' /tmp/wheel-adv.txt; then
            echo "::error::the placement matrix did not run clean against the wheel (pytest exit $status). 'skipped' means CCS_SANITIZE_BIN did not resolve and the step proved nothing."
            exit 1
          fi
          if ! grep -qE '[0-9]+ passed' /tmp/wheel-adv.txt; then
            echo "::error::the placement matrix reported no passing tests against the wheel"
            exit 1
          fi

      # `tests` ships in the sdist so a packager or an auditor can re-run
      # the suite against the exact published source. That claim only stays
      # true if something checks it, and nothing did: issue #182 was a test
      # reaching up to `.claude/hooks/` from a tarball that has no repo root,
      # producing three red tests in the drift guard of a security tool for
      # anyone who did what the packaging comment invites. Running the
      # SHIPPED tests from an unpacked sdist, outside the checkout, moves
      # that failure here from a stranger's terminal.
      #
      # The venv's bin goes on PATH so the console-script tests run rather
      # than skipping themselves for want of `ccs-sanitize`.
      - name: Run the shipped test suite from the unpacked sdist
        run: |
          set -euo pipefail
          mkdir -p /tmp/sdist-check
          tar -xzf dist/*.tar.gz -C /tmp/sdist-check
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/python -m pip install --upgrade pip
          cd /tmp/sdist-check/*/
          /tmp/sdist-venv/bin/python -m pip install . pytest
          PATH="/tmp/sdist-venv/bin:$PATH" \
            /tmp/sdist-venv/bin/python -m pytest tests -q

  # Single always-reporting status check. Branch protection points at this
  # job name, not at the matrix cells: matrix job names carry the interpreter
  # version, so adding or dropping a cell would otherwise mean editing the
  # required-checks list in repo settings in lockstep, and forgetting that is
  # a silent loss of coverage. `if: always()` makes this report even when an
  # upstream job is skipped or cancelled, which is what keeps it usable as a
  # required check.
  gate:
    name: sanitizer-ci
    runs-on: ubuntu-latest
    needs: [tests, package]
    if: always()
    steps:
      - name: Fail if any upstream job did not succeed
        run: |
          set -euo pipefail
          echo "tests:   ${{ needs.tests.result }}"
          echo "package: ${{ needs.package.result }}"
          if [ "${{ needs.tests.result }}" != "success" ] || \
             [ "${{ needs.package.result }}" != "success" ]; then
            echo "::error::sanitizer CI did not pass; see the jobs above"
            exit 1
          fi
