name: Format-scan CI

# The leak gate in front of the drift scanner (issue #244).
#
# scan.py reads raw, unsanitized session transcripts out of
# ~/.claude/projects/ and must never emit their contents. That discipline is
# the scanner's own responsibility by design: block_secret_reads.py
# deliberately does not block its read path, so nothing outside this suite
# stands between a careless edit and a leak.
#
# test_content_free_contract.py is what converts the SECURITY CONTRACT
# docstring from a reviewer's eyeball into a gate. It plants sentinels in
# every value-bearing surface the scanner reads and asserts that not one byte
# reaches stdout in any mode. Until this workflow existed the suite ran when
# someone remembered to run it, which meant an edit widening a fold's
# allowlist, or dropping a fold entirely, could merge green.
#
# Why there is no `paths:` filter, for the same two reasons sanitizer-ci.yml
# gives at length:
#
#   1. A paths-filtered required check sits permanently "Expected" on any PR
#      that does not touch the filtered paths, which blocks post-only PRs.
#   2. The suite is not scanner-scoped in practice. Its assertions are about
#      what the scanner may print, and the fixtures it reasons from live in
#      fixtures/ — a change there can invalidate an attestation here.
#
# The suite runs in about three seconds, so running it unconditionally costs
# less than either failure mode. Keep that number honest: it is the stated
# basis for having no filter.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # One red interpreter should not hide the state of the others.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # scan.py is a standalone stdlib-only script, not a package: the suite
      # loads it by path via tests/_helpers.py. pytest is the only dependency,
      # and installing nothing else keeps this gate honest about the fact that
      # the scanner must run on a bare interpreter.
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      # Named explicitly rather than globbed. `pytest <dir>` on a directory
      # that quietly lost a file is still green, and a security gate that can
      # go hollow without anyone noticing is not a gate.
      - name: Assert the security-contract suite is present
        run: test -f tooling/format-scan/tests/test_content_free_contract.py

      - name: Run the suite
        run: python -m pytest tooling/format-scan/tests/ -q

  gate:
    # Aggregate status check. Branch protection points at this one job name,
    # so adding or removing a matrix cell does not require editing the
    # required-checks list.
    name: format-scan-ci
    runs-on: ubuntu-latest
    needs: [tests]
    if: always()
    steps:
      - name: Fail if any dependency failed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "A required job failed."
            exit 1
          fi
          echo "All required jobs passed."
