name: Prettier (posts)

# Pre-merge gate so posts/ is Prettier-clean BEFORE it reaches main and gets
# synced to the Pages site, whose own `prettier . --check` would otherwise turn
# red on a dirty post (bit the retry post on 2026-06-08). Scoped to posts/ only;
# the rest of the repo is authored to other conventions. See issue #76.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      # Pinned to the Pages site's EXACT formatter versions (prettier 3.9.5 +
      # @shopify/prettier-plugin-liquid 1.11.0), not caret ranges, so source ==
      # deployed. Caret ranges are how this drifted: the site pinned 3.9.5 while
      # this repo's lockfile sat on 3.8.3, which would let a post pass here and
      # still fail the site's own `prettier . --check` — the exact failure this
      # gate exists to prevent. When the site bumps its pin, bump this to match.
      - run: npm ci

      - run: npm run format:check
