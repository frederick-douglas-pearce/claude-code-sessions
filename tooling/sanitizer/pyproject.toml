[build-system]
# >=1.27 for PEP 639 support (SPDX `license` expression + `license-files`).
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "claude-code-sessions-sanitizer"
dynamic = ["version"]
description = "Scrub Claude Code session JSONL files for safe publication."
# Content type pinned rather than inferred from the extension: this string
# is what PyPI uses to render the project page.
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
# PEP 639. `LICENSE` is a verbatim copy of the repo-root LICENSE, kept here
# so the built wheel and sdist carry the license text (the repo root is
# outside the build context).
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Fred Pearce" }]
keywords = ["claude-code", "jsonl", "sanitization", "security", "redaction"]
# No `License ::` classifier: PEP 639 makes it redundant and build backends
# warn when it is mixed with the SPDX expression above.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ccs-sanitize = "ccs_sanitize.cli:main"

[project.urls]
Repository = "https://github.com/frederick-douglas-pearce/claude-code-sessions"
Issues = "https://github.com/frederick-douglas-pearce/claude-code-sessions/issues"
"PRD" = "https://github.com/frederick-douglas-pearce/claude-code-sessions/blob/main/.claude/specs/prd-sanitizer.md"

[tool.hatch.version]
path = "src/ccs_sanitize/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ccs_sanitize"]

[tool.hatch.build.targets.sdist]
# `tests` ships in the sdist deliberately: a downstream packager or a
# security auditor can re-run the fail-closed and residual-scan suites
# against the exact published source. They stay out of the wheel (the
# wheel target packages `src/ccs_sanitize` only).
include = [
    "src",
    "tests",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
# Registered so an unmarked-marker warning cannot mask a real one. The
# adversarial matrix spawns one subprocess per cell, which is slower than
# the rest of the suite by roughly an order of magnitude; `-m "not
# adversarial"` deselects it for a fast inner loop. CI always runs it.
markers = [
    "adversarial: structural placement matrix (PRD section 14 C-1); one subprocess per cell",
]
