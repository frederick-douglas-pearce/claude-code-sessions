[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-code-sessions-sanitizer"
dynamic = ["version"]
description = "Scrub Claude Code session JSONL files for safe publication."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Fred Pearce" }]
keywords = ["claude-code", "jsonl", "sanitization", "security", "redaction"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ccs-sanitize = "ccs_sanitize.cli:main"

[project.urls]
Repository = "https://github.com/frederick-douglas-pearce/claude-code-sessions"
Issues = "https://github.com/frederick-douglas-pearce/claude-code-sessions/issues"
"PRD" = "https://github.com/frederick-douglas-pearce/claude-code-sessions/blob/main/.claude/specs/prd-sanitizer.md"

[tool.hatch.version]
path = "src/ccs_sanitize/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ccs_sanitize"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "README.md",
    "CHANGELOG.md",
    "pyproject.toml",
]
